name: Bootstrap Hadron v3 Source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  unpack:
    if: github.event_name != 'issues' || github.event.issue.title == 'bootstrap-hadron-v3-source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/hadron-source.tar.xz"
          for chunk in bootstrap/part-*.b64 bootstrap/rest.b64; do
            base64 --decode "$chunk" >> "$RUNNER_TEMP/hadron-source.tar.xz"
          done
          xz --test "$RUNNER_TEMP/hadron-source.tar.xz"

          mkdir -p "$RUNNER_TEMP/hadron-source"
          tar -xJf "$RUNNER_TEMP/hadron-source.tar.xz" -C "$RUNNER_TEMP/hadron-source"

          SOURCE="$RUNNER_TEMP/hadron-source"
          TOP_COUNT="$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [ "$TOP_COUNT" = "1" ]; then
            ONLY="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -print -quit)"
            if [ -d "$ONLY" ]; then
              SOURCE="$ONLY"
            fi
          fi

          echo "Extracted source root: $SOURCE"
          find "$SOURCE" -maxdepth 2 -type f | head -100

          rm -rf bootstrap
          rsync -a --exclude='.git/' "$SOURCE"/ ./

          rm -f .github/workflows/bootstrap-source.yml

          if find . -type f -iname '*private*.pem' -not -path './.git/*' | grep -q .; then
            echo "Refusing to commit a private PEM key."
            exit 1
          fi

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bxane"
          git config user.email "bxane-dev@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi

          git commit -m "Hadron v3.0.0 stable source — bxane (bxane-dev)"
          git push origin HEAD:main
